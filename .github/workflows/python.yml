name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q
      - run: python -m compileall -q src tools arm_kinematics.py
      - name: Validate physical experiment harness
        run: python tools/record_physical_experiment.py --dry-run --output-dir artifacts/ci
