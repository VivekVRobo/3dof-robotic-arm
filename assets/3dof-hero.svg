<text x="58" y="119" font-size="48" font-weight="800" fill="#132436">3DOF Robotic Arm</text>
<text x="58" y="155" font-size="22" font-weight="650" fill="#395260">From analytic model to measured physical endpoint</text>
<text x="58" y="210" font-size="18.5" fill="#425866">FK · IK · Cartesian waypoints · servo mapping · serial control</text>
<text x="58" y="238" font-size="18.5" fill="#425866">with explicit separation between software proof and hardware proof.</text>
