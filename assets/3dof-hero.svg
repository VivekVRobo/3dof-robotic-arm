<title id="t">3DOF Robotic Arm — Kinematics, Planning and Physical Validation</title>
<desc id="d">A desk scale 3DOF robotic arm engineering project with analytic forward and inverse kinematics, Cartesian planning, servo mapping, numerical validation, and a physical measurement path.</desc>
